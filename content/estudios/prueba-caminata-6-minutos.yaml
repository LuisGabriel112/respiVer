name: 'Prueba de caminata de 6 minutos'
shortName: 'PC6M'
order: 10
category: 'Función Pulmonar en Ejercicio'
categorySlug: 'ejercicio'
tagline: 'Mide la capacidad funcional real del paciente en condiciones de ejercicio submáximo'
description: 'La PC6M es la prueba de ejercicio más utilizada en neumología y cardiología. Refleja la capacidad funcional global y es uno de los mejores predictores de calidad de vida y mortalidad.'
howItWorks:
  - 'Se establece un corredor recto de 30 metros.'
  - 'El paciente descansa 10 minutos antes. Se miden signos vitales basales.'
  - 'Se instruye: caminar lo más lejos posible en 6 minutos.'
  - 'Se registra SpO₂ y FC continuamente.'
  - 'Al finalizar se registra distancia total, SpO₂ mínima y escala de Borg.'
parameters:
  - name: 'Distancia recorrida (metros)'
    description: 'Principal resultado. Se compara con valores de referencia por edad/sexo.'
    reference: '< 350 m en EPOC = alto riesgo'
  - name: 'SpO₂ mínima durante la prueba (%)'
    description: 'Desaturación ≥ 4% es clínicamente significativa.'
    reference: ''
  - name: 'Escala de Borg post-ejercicio'
    description: 'Percepción de disnea y fatiga (0–10).'
    reference: ''
indications:
  - 'Evaluación funcional en EPOC, fibrosis pulmonar e hipertensión pulmonar'
  - 'Pre y post trasplante pulmonar'
  - 'Seguimiento de programas de rehabilitación'
duration: '30–40 minutos'
preparation:
  - 'Usar ropa y calzado cómodo'
  - 'No realizar ejercicio vigoroso en las 2 horas previas'
  - 'Traer dispositivos de apoyo habituales'
clinicalSignificance: 'En hipertensión pulmonar, la PC6M guía las decisiones de inicio o escalonamiento de tratamiento.'

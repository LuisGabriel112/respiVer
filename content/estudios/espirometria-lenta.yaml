name: 'Espirometría lenta'
order: 3
category: 'Mecánica Pulmonar'
categorySlug: 'mecanica-pulmonar'
tagline: 'Medición precisa de volúmenes pulmonares sin maniobras forzadas'
description: 'La espirometría lenta mide los volúmenes pulmonares mediante maniobras lentas y controladas, sin requerir esfuerzo explosivo. Es especialmente valiosa en pacientes mayores, con EPOC avanzado o enfermedades neuromusculares.'
howItWorks:
  - 'El paciente respira tranquilamente para establecer el patrón basal.'
  - 'Se inhala profunda y lentamente desde el nivel de reposo hasta la capacidad pulmonar máxima.'
  - 'Se exhala de forma lenta y completa.'
  - 'Se repite al menos 3 veces.'
parameters:
  - name: 'VC — Capacidad Vital lenta'
    description: 'Volumen máximo movilizado con maniobra lenta.'
    reference: 'Normal: ≥ 80% del predicho'
  - name: 'IC — Capacidad Inspiratoria'
    description: 'Volumen inhalado desde la posición de reposo hasta la inspiración máxima.'
    reference: ''
  - name: 'ERV — Volumen de Reserva Espiratorio'
    description: 'Volumen exhalado desde la FRC hasta el vaciado máximo.'
    reference: ''
  - name: 'VT — Volumen Corriente'
    description: 'Volumen de aire movilizado en cada respiración tranquila.'
    reference: ''
indications:
  - 'Pacientes con EPOC grave'
  - 'Adultos mayores con limitaciones físicas'
  - 'Enfermedades neuromusculares'
  - 'Complemento a la pletismografía'
duration: '15–25 minutos'
preparation:
  - 'No fumar al menos 4 horas antes'
  - 'Usar ropa cómoda'
clinicalSignificance: 'La diferencia VC-FVC es un indicador de atrapamiento aéreo, útil para cuantificar la obstrucción real en EPOC avanzado.'
image: 'espirometro.png'
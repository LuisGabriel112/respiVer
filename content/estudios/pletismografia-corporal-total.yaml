name: 'Pletismografía corporal total'
shortName: 'Pletismografía'
order: 4
category: 'Volúmenes Pulmonares'
categorySlug: 'volumenes-pulmonares'
tagline: 'El estándar de oro para medir los volúmenes pulmonares absolutos'
description: 'La pletismografía corporal es la técnica de referencia para medir los volúmenes pulmonares absolutos, incluidos el volumen residual y la capacidad pulmonar total. El paciente se sienta dentro de una cabina hermética y mediante variaciones de presión y volumen se calculan todos los compartimentos pulmonares.'
howItWorks:
  - 'El paciente entra en la cabina pletismográfica y se sienta cómodamente.'
  - 'Se adapta una boquilla y una pinza nasal, y la puerta se cierra.'
  - 'El paciente respira tranquilamente para establecer la línea de base.'
  - 'A nivel de la FRC se ocluye el flujo y el paciente realiza esfuerzos respiratorios suaves.'
  - 'Se complementa con espirometría lenta y forzada.'
parameters:
  - name: 'TLC — Capacidad Pulmonar Total'
    description: 'Volumen total de aire en los pulmones al final de una inspiración máxima.'
    reference: 'Normal: 80–120% del predicho'
  - name: 'RV — Volumen Residual'
    description: 'Aire que permanece en los pulmones después de una espiración máxima.'
    reference: 'Normal: 80–135% del predicho'
  - name: 'FRC — Capacidad Residual Funcional'
    description: 'Volumen de aire al final de una respiración tranquila.'
    reference: ''
  - name: 'RV/TLC — Índice de atrapamiento'
    description: 'Proporción del volumen residual respecto a la TLC.'
    reference: 'Normal: < 35%'
  - name: 'Raw — Resistencia de vías aéreas'
    description: 'Oposición al flujo de aire a través del árbol bronquial.'
    reference: ''
indications:
  - 'Diagnóstico y cuantificación de hiperinsuflación en EPOC'
  - 'Evaluación de atrapamiento aéreo'
  - 'Diagnóstico de restricción verdadera'
  - 'Enfermedades pulmonares intersticiales'
  - 'Valoración preoperatoria de cirugía pulmonar'
duration: '30–45 minutos'
preparation:
  - 'No fumar al menos 4 horas antes'
  - 'Evitar broncodilatadores según indicación'
  - 'No realizar ejercicio intenso 30 minutos antes'
  - 'Informar si tiene claustrofobia'
clinicalSignificance: 'Es el único método que mide con exactitud la TLC para confirmar restricción verdadera y cuantificar hiperinsuflación en EPOC.'

name: 'Polisomnografía'
shortName: 'PSG'
order: 11
category: 'Estudios del Sueño'
categorySlug: 'sueno'
tagline: 'El estudio completo del sueño que evalúa todas sus etapas y los eventos respiratorios'
description: 'La polisomnografía es el estudio de referencia para el diagnóstico de los trastornos del sueño. Registra simultáneamente múltiples señales fisiológicas: EEG, movimientos oculares, tono muscular, flujo de aire, esfuerzo respiratorio, saturación de oxígeno y posición corporal.'
howItWorks:
  - 'El paciente llega a la unidad por la noche (9–10 pm).'
  - 'Se colocan los sensores: electrodos en cuero cabelludo, perioculares, en barbilla, piernas, sensor de flujo, oxímetro y ECG.'
  - 'Se calibran los equipos con el paciente despierto.'
  - 'El paciente duerme mientras el técnico monitoriza en tiempo real.'
  - 'Se registra el sueño completo (7–8 horas).'
parameters:
  - name: 'IAH — Índice de Apnea-Hipopnea (eventos/hora)'
    description: 'Número de apneas e hipopneas por hora de sueño real.'
    reference: 'Normal: < 5/h | Leve: 5–14/h | Moderado: 15–29/h | Grave: ≥ 30/h'
  - name: 'Arquitectura del sueño'
    description: 'Distribución de fases N1, N2, N3 y REM.'
    reference: ''
  - name: 'SpO₂ mínima y T90'
    description: 'Saturación mínima y tiempo con SpO₂ < 90%.'
    reference: ''
  - name: 'IAR — Índice de microdespertares'
    description: 'Número de microdespertares por hora de sueño.'
    reference: 'Normal: < 15/h'
indications:
  - 'Diagnóstico de apnea-hipopnea obstructiva del sueño (SAOS)'
  - 'Sospecha de hipoventilación nocturna'
  - 'Narcolepsia y trastornos de hipersomnia'
  - 'Parasomnias'
  - 'Titulación de CPAP'
duration: 'Noche completa (8–9 horas en la unidad)'
preparation:
  - 'No consumir alcohol ni sedantes el día del estudio'
  - 'No tomar café a partir del mediodía'
  - 'Lavarse el cabello sin productos'
  - 'Traer ropa cómoda para dormir'
clinicalSignificance: 'Un IAH ≥ 30/h con hipoxemia se asocia con el doble de riesgo de hipertensión y triple riesgo de accidente cerebrovascular.'

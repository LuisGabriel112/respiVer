name: 'Espirometría pre y post-broncodilatador'
shortName: 'Espirometría BD'
order: 2
category: 'Mecánica Pulmonar'
categorySlug: 'mecanica-pulmonar'
tagline: 'Determina si la obstrucción bronquial es reversible con medicamento'
description: 'La espirometría con prueba broncodilatadora consiste en realizar dos espirometrías: una basal y otra 15–20 minutos después de administrar un broncodilatador inhalado. La comparación entre ambas permite determinar si la obstrucción bronquial es reversible —característica del asma— o fija —como en el EPOC—.'
howItWorks:
  - 'Se realiza una espirometría basal completa.'
  - 'Se administran 4 puffs de salbutamol (400 mcg) a través de una cámara espaciadora.'
  - 'El paciente espera 15–20 minutos.'
  - 'Se repite la espirometría completa.'
  - 'Se comparan los valores para calcular la respuesta broncodilatadora.'
parameters:
  - name: 'Cambio absoluto en FEV₁ (mL)'
    description: 'Diferencia en mililitros del FEV₁ entre el valor post y pre-broncodilatador.'
    reference: 'Significativo: ≥ 200 mL'
  - name: 'Cambio relativo en FEV₁ (%)'
    description: 'Porcentaje de cambio del FEV₁ respecto al valor basal.'
    reference: 'Significativo: ≥ 12%'
  - name: 'Cambio en FVC'
    description: 'Aumento de la capacidad vital forzada post-broncodilatador.'
    reference: 'Significativo: ≥ 12% y ≥ 200 mL'
indications:
  - 'Diagnóstico diferencial entre asma bronquial y EPOC'
  - 'Confirmación de reversibilidad en obstrucción detectada'
  - 'Evaluación del fenotipo de EPOC'
  - 'Orientación en la elección del tratamiento'
duration: '45–60 minutos'
preparation:
  - 'Suspender broncodilatadores de acción corta 4 horas antes'
  - 'Suspender broncodilatadores de acción larga 12 horas antes'
  - 'No fumar al menos 4 horas antes'
clinicalSignificance: 'Una respuesta broncodilatadora significativa (FEV₁ ≥ 12% y ≥ 200 mL) apoya el diagnóstico de asma bronquial.'
image: 'espirometro.png'
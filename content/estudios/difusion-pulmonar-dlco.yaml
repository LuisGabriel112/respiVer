name: 'Difusión pulmonar de monóxido de carbono (DLCO)'
shortName: 'DLCO'
order: 7
category: 'Intercambio de O₂ y Biomarcadores'
categorySlug: 'intercambio-gases'
tagline: 'Evalúa la capacidad de los pulmones para transferir oxígeno a la sangre'
description: 'La DLCO mide la eficiencia con la que los pulmones transfieren gases desde el alvéolo hasta los glóbulos rojos. Es una de las pruebas más sensibles para detectar enfermedades que afectan la membrana alveolo-capilar.'
howItWorks:
  - 'El paciente exhala completamente hasta el volumen residual.'
  - 'Inhala rápidamente una mezcla de gases trazadores.'
  - 'Mantiene el aliento 10 segundos en apnea.'
  - 'Exhala lentamente; se recoge muestra del alveolar.'
  - 'Se realizan al menos 2 maniobras con intervalo de 4 minutos.'
parameters:
  - name: 'DLCO (mL CO/min/mmHg)'
    description: 'Capacidad total de transferencia del CO a través de la membrana alveolo-capilar.'
    reference: 'Normal: ≥ 70% del predicho'
  - name: 'KCO — Factor de transferencia (DLCO/VA)'
    description: 'DLCO dividida entre el volumen alveolar accesible.'
    reference: 'Normal: ≥ 70% del predicho'
  - name: 'VA — Volumen Alveolar'
    description: 'Volumen de pulmón accesible al gas trazador.'
    reference: ''
indications:
  - 'Fibrosis pulmonar y enfermedades intersticiales'
  - 'Cuantificación del enfisema en EPOC'
  - 'Hipertensión arterial pulmonar'
  - 'Toxicidad pulmonar por fármacos'
  - 'Valoración preoperatoria de resección pulmonar'
duration: '20–30 minutos'
preparation:
  - 'No fumar al menos 24 horas antes'
  - 'No realizar ejercicio físico intenso 4 horas antes'
  - 'Informar si tiene anemia'
clinicalSignificance: 'Una DLCO < 40% indica alto riesgo de desaturación durante el ejercicio. La velocidad de caída predice mortalidad en fibrosis pulmonar.'
image: 'dlco.png'
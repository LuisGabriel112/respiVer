name: 'Prueba de saturación y titulación de oxígeno'
shortName: 'Saturometría / Titulación O₂'
order: 9
category: 'Función Pulmonar en Ejercicio'
categorySlug: 'ejercicio'
tagline: 'Determina si necesitas oxígeno suplementario y en qué cantidad exacta'
description: 'Esta prueba monitoriza la saturación de oxígeno durante reposo, actividad física o sueño. Cuando la SpO₂ cae por debajo de 88–90%, existe hipoxemia que puede causar daño cardíaco a largo plazo.'
howItWorks:
  - 'Se coloca un sensor de pulsioximetría de dedo.'
  - 'Se registra la SpO₂ y FC basales en reposo 5 minutos.'
  - 'El paciente realiza la actividad física estandarizada.'
  - 'Si la SpO₂ cae, se inicia la titulación de O₂.'
  - 'Se van ajustando flujos hasta obtener saturación estable ≥ 90%.'
parameters:
  - name: 'SpO₂ basal (%)'
    description: 'Saturación de oxígeno en sangre en reposo.'
    reference: 'Normal: ≥ 95%'
  - name: 'SpO₂ mínima en ejercicio o sueño (%)'
    description: 'Valor más bajo registrado durante la prueba.'
    reference: ''
  - name: 'Porcentaje de tiempo con SpO₂ < 90% (T90)'
    description: 'Relevante para prescripción de oxigenoterapia domiciliaria.'
    reference: ''
  - name: 'Flujo óptimo de O₂ (L/min)'
    description: 'Menor flujo necesario para mantener SpO₂ ≥ 90%.'
    reference: ''
indications:
  - 'EPOC moderado-grave con sospecha de insuficiencia respiratoria'
  - 'Fibrosis pulmonar con desaturación'
  - 'Evaluación antes de vuelo en avión'
  - 'Prescripción de oxigenoterapia domiciliaria'
duration: '30 minutos – 8 horas (según protocolo)'
preparation:
  - 'Usar ropa y calzado cómodo'
  - 'Traer el equipo de oxigenoterapia domiciliario si ya lo usa'
  - 'Traer medicamentos de rescate'
clinicalSignificance: 'La oxigenoterapia domiciliaria continua en EPOC con hipoxemia crónica es la única intervención que reduce mortalidad.'
image: ''